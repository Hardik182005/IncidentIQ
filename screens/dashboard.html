<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>IncidentIQ — SRE Command Center</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@300;400;500;600;700&family=JetBrains+Mono:ital,wght@0,300;0,400;0,500;1,300&display=swap" rel="stylesheet" />
  <style>
    :root {
      --bg:#080810; --bg2:#0c0c1a; --card:rgba(255,255,255,0.038);
      --border:rgba(255,255,255,0.15); --border2:rgba(255,255,255,0.25);
      --text:#ffffff; --text2:#f1f5f9; --muted:#cbd5e1;
      --blue:#ffffff; --cyan:#06B6D4; --red:#EF4444;
      --green:#10B981; --amber:#F59E0B; --purple:#8B5CF6;
    }
    *,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
    html,body{
      width:100%;height:100%;
      background-color:var(--bg);
      background-image:
        radial-gradient(circle, rgba(255,255,255,0.20) 1.5px, transparent 1.5px),
        radial-gradient(circle, rgba(255,255,255,0.06) 1px, transparent 1px),
        linear-gradient(rgba(255,255,255,0.06) 1px, transparent 1px),
        linear-gradient(90deg, rgba(255,255,255,0.06) 1px, transparent 1px);
      background-size:
        88px 88px,
        22px 22px,
        88px 88px,
        88px 88px;
      color:var(--text);font-family:'Space Grotesk',sans-serif;overflow:hidden;-webkit-font-smoothing:antialiased;font-weight:500;
    }
    #root{width:100%;height:100%;position:relative;z-index:10}
    #particle-canvas{position:fixed;inset:0;pointer-events:none;z-index:0}
    #scanline{position:fixed;top:0;left:0;width:100%;height:140px;background:linear-gradient(to bottom,transparent,rgba(255,255,255,0.015),transparent);animation:scan 12s linear infinite;pointer-events:none;z-index:2}
    #vignette{position:fixed;inset:0;background:radial-gradient(ellipse at 50% 50%,transparent 45%,rgba(0,0,0,0.55) 100%);pointer-events:none;z-index:1}
    ::-webkit-scrollbar{width:3px;height:3px}
    ::-webkit-scrollbar-track{background:transparent}
    ::-webkit-scrollbar-thumb{background:rgba(255,255,255,0.18);border-radius:2px}
    @keyframes scan{from{transform:translateY(-100%)}to{transform:translateY(100vh)}}
    @keyframes breathe{0%,100%{transform:scale(1);opacity:.8}50%{transform:scale(1.06);opacity:1}}
    @keyframes breathe-fast{0%,100%{transform:scale(1)}50%{transform:scale(1.12)}}
    @keyframes spin{from{transform:rotate(0deg)}to{transform:rotate(360deg)}}
    @keyframes spin-rev{from{transform:rotate(360deg)}to{transform:rotate(0deg)}}
    @keyframes slide-down{from{transform:translateY(-22px);opacity:0}to{transform:translateY(0);opacity:1}}
    @keyframes fade-in{from{opacity:0}to{opacity:1}}
    @keyframes flicker{0%,88%,100%{opacity:1}92%{opacity:.2}}
    @keyframes flash-red{0%{opacity:0}12%{opacity:1}72%{opacity:.9}100%{opacity:0}}
    @keyframes float-up{from{transform:translateY(10px);opacity:0}to{transform:translateY(0);opacity:1}}
    @keyframes pulse-ring{0%{transform:scale(1);opacity:.5}100%{transform:scale(2.8);opacity:0}}
  </style>
  <script src="https://cdn.jsdelivr.net/npm/react@18.3.1/umd/react.production.min.js" crossorigin="anonymous"></script>
  <script src="https://cdn.jsdelivr.net/npm/react-dom@18.3.1/umd/react-dom.production.min.js" crossorigin="anonymous"></script>
</head>
<body>
  <canvas id="particle-canvas"></canvas>
  <div id="scanline"></div>
  <div id="vignette"></div>
  <div id="root"></div>

  <script>
    (function(){
      const canvas=document.getElementById('particle-canvas'),ctx=canvas.getContext('2d');
      let W=canvas.width=window.innerWidth,H=canvas.height=window.innerHeight;
      window.addEventListener('resize',()=>{W=canvas.width=window.innerWidth;H=canvas.height=window.innerHeight});
      const N=35,D=128,D2=D*D,pts=Array.from({length:N},()=>({x:Math.random()*W,y:Math.random()*H,vx:(Math.random()-.5)*.22,vy:(Math.random()-.5)*.22,r:Math.random()*1.2+.3,a:Math.random()*.32+.07}));
      (function loop(){
        ctx.clearRect(0,0,W,H);
        for(const p of pts){p.x=(p.x+p.vx+W)%W;p.y=(p.y+p.vy+H)%H;ctx.beginPath();ctx.arc(p.x,p.y,p.r,0,6.28);ctx.fillStyle=`rgba(255,255,255,${p.a})`;ctx.fill()}
        for(let i=0;i<N;i++)for(let j=i+1;j<N;j++){const dx=pts[i].x-pts[j].x,dy=pts[i].y-pts[j].y,d2=dx*dx+dy*dy;if(d2<D2){const d=Math.sqrt(d2);ctx.beginPath();ctx.moveTo(pts[i].x,pts[i].y);ctx.lineTo(pts[j].x,pts[j].y);ctx.strokeStyle=`rgba(255,255,255,${(1-d/D)*.09})`;ctx.lineWidth=.5;ctx.stroke()}}
        requestAnimationFrame(loop);
      })();
    })();
  </script>

  <!-- Precompiled Command Center bundle (built by tools/build-dashboard.mjs).
       Plain JS — no in-browser Babel — so the page loads instantly on every visit. -->
  <script src="../components/data.js"></script>
  <script src="../components/incident-card.js"></script>
  <script src="../components/charts.js"></script>
  <script src="../components/voice-orb.js"></script>
  <script src="../components/dashboard-app.js"></script>
</body>
</html>
