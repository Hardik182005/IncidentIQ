<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" /><meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>IncidentIQ — Runbooks</title>
  <link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@300;400;500;600;700&family=JetBrains+Mono:wght@300;400;500&display=swap" rel="stylesheet" />
  <style>
    :root{--bg:#000000;--bg2:#09090b;--bg3:#121215;--border:rgba(255,255,255,0.15);--border2:rgba(255,255,255,0.25);--text:#ffffff;--text2:#f1f5f9;--muted:#cbd5e1;--blue:#ffffff;--cyan:#06B6D4;--red:#EF4444;--green:#10B981;--amber:#F59E0B;--purple:#8B5CF6}
    *,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
    html,body{height:100%;background:var(--bg);color:var(--text);font-family:'Space Grotesk',sans-serif;-webkit-font-smoothing:antialiased;overflow:hidden;font-weight:500;}
    a{text-decoration:none;color:inherit}
    ::-webkit-scrollbar{width:3px}::-webkit-scrollbar-track{background:transparent}::-webkit-scrollbar-thumb{background:rgba(255,255,255,0.18);border-radius:2px}
    .app{display:flex;height:100vh;overflow:hidden}
    .main{flex:1;display:flex;flex-direction:column;overflow:hidden;min-width:0}
    .sidebar{width:218px;flex-shrink:0;background:rgba(6,6,8,0.92);border-right:1px solid var(--border);display:flex;flex-direction:column}
    .sb-top{padding:18px;border-bottom:1px solid var(--border)}
    .sb-logo{display:flex;align-items:center;gap:10px}
    .sq{width:32px;height:32px;background:linear-gradient(135deg,#ffffff,#64748b);border-radius:8px;display:flex;align-items:center;justify-content:center;font-size:12px;font-weight:800;color:#000000;letter-spacing:-0.05em;flex-shrink:0;box-shadow:0 0 22px rgba(255,255,255,0.28)}
    .brand{color:var(--text);font-weight:700;font-size:14px;letter-spacing:-0.02em;line-height:1.1}
    .brand-s{color:var(--muted);font-size:9px;letter-spacing:0.1em;text-transform:uppercase;font-weight:700;}
    .sb-nav{padding:10px 9px;flex:1}
    .sb-lnk{display:flex;align-items:center;gap:9px;padding:7px 10px;border-radius:7px;color:var(--text2);font-size:13px;margin-bottom:2px;transition:all 0.14s;border:1px solid transparent;font-weight:600;}
    .sb-lnk:hover{background:rgba(255,255,255,0.048);color:var(--text)}
    .sb-lnk.active{background:rgba(255,255,255,0.09);color:#ffffff;border-color:rgba(255,255,255,0.22);font-weight:700}
    .sb-icon{font-size:13px;width:16px;text-align:center;flex-shrink:0}
    .sb-badge{background:rgba(239,68,68,0.18);color:var(--red);border:1px solid rgba(239,68,68,0.28);border-radius:8px;padding:0 6px;font-size:10px;font-family:'JetBrains Mono',monospace;margin-left:auto;font-weight:700;}
    .sb-ai{padding:12px 16px;border-top:1px solid var(--border);border-bottom:1px solid var(--border)}
    .sb-sec{color:var(--muted);font-size:9px;letter-spacing:0.12em;text-transform:uppercase;margin-bottom:9px;font-weight:700;}
    .sb-prov{display:flex;align-items:center;gap:8px;margin-bottom:7px;font-size:12px;color:var(--text2);font-weight:600;}
    .sb-lat{margin-left:auto;font-size:10px;font-family:'JetBrains Mono',monospace;color:var(--muted);font-weight:600;}
    .dot{width:6px;height:6px;border-radius:50%;flex-shrink:0;background:var(--green)}
    .sb-ws{padding:12px 16px;display:flex;align-items:center;gap:8px;font-size:11px;color:var(--muted);font-family:'JetBrains Mono',monospace;font-weight:600;}
    .ws-bars{display:flex;gap:2px;align-items:flex-end;margin-left:auto}
    .ws-b{width:3px;border-radius:1px;background:var(--green)}
    .topbar{padding:9px 22px;border-bottom:1px solid var(--border);display:flex;align-items:center;gap:24px;background:rgba(6,6,8,0.5);flex-shrink:0;min-height:52px}
    .ts .tl{color:var(--muted);font-size:9px;letter-spacing:0.1em;margin-bottom:1px;font-weight:700;}
    .ts .tv{font-size:15px;font-weight:700;font-family:'JetBrains Mono',monospace}
    .topbar-time{margin-left:auto;color:var(--muted);font-size:11px;font-family:'JetBrains Mono',monospace;font-weight:700;}
    .content{flex:1;overflow-y:auto;padding:22px 24px}
    .page-hd{display:flex;align-items:flex-start;justify-content:space-between;margin-bottom:20px}
    .page-title{font-size:22px;font-weight:700;letter-spacing:-0.03em}
    .page-sub{font-size:13px;color:var(--text2);margin-top:2px;font-weight:600;}
    /* Filter pills */
    .filter-pills{display:flex;gap:6px;margin-bottom:22px;flex-wrap:wrap;align-items:center}
    .pill{background:var(--bg2);border:1px solid var(--border);border-radius:6px;padding:6px 14px;font-size:12px;color:var(--muted);cursor:pointer;transition:all 0.15s;font-family:'JetBrains Mono',monospace;font-weight:600;}
    .pill:hover{background:var(--bg3);color:var(--text)}
    .pill.active{background:rgba(255,255,255,0.14);border-color:rgba(255,255,255,0.35);color:#ffffff}
    .search-box{background:var(--bg2);border:1px solid var(--border);border-radius:6px;padding:6px 14px;font-size:12px;color:var(--text);font-family:'Space Grotesk',sans-serif;outline:none;margin-left:auto;min-width:200px;transition:border-color 0.2s;font-weight:600;}
    .search-box::placeholder{color:var(--muted)}
    .search-box:focus{border-color:rgba(255,255,255,0.4)}
    /* Runbook grid */
    .rb-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:14px}
    .rb-card{background:var(--bg2);border:1px solid var(--border);border-radius:12px;overflow:hidden;transition:all 0.2s}
    .rb-card:hover{background:var(--bg3);border-color:var(--border2)}
    .rb-head{padding:18px 18px 14px;border-bottom:1px solid var(--border)}
    .rb-cat{font-size:9px;font-family:'JetBrains Mono',monospace;letter-spacing:0.12em;text-transform:uppercase;margin-bottom:10px;display:inline-block;padding:2px 8px;border-radius:3px;font-weight:700;}
    .rb-title{font-size:15px;font-weight:700;letter-spacing:-0.02em;margin-bottom:6px;line-height:1.25}
    .rb-desc{font-size:12px;color:var(--text2);line-height:1.55;font-weight:400}
    .rb-meta{padding:12px 18px;display:flex;align-items:center;gap:12px;flex-wrap:wrap}
    .rb-metaitem{font-size:10px;color:var(--muted);font-family:'JetBrains Mono',monospace;display:flex;align-items:center;gap:4px;font-weight:600;}
    .rb-actions{padding:0 18px 16px;display:flex;gap:8px}
    .rb-btn{flex:1;background:rgba(255,255,255,0.04);border:1px solid var(--border);border-radius:7px;padding:8px;font-size:12px;color:var(--text2);cursor:pointer;font-family:'Space Grotesk',sans-serif;transition:all 0.15s;font-weight:700;}
    .rb-btn:hover{background:rgba(255,255,255,0.08);color:var(--text)}
    .rb-btn.primary{background:rgba(255,255,255,0.08);border-color:rgba(255,255,255,0.22);color:#ffffff}
    .rb-btn.primary:hover{background:rgba(255,255,255,0.16);border-color:rgba(255,255,255,0.4)}
    /* Expanded steps */
    .rb-steps{background:rgba(255,255,255,0.02);border-top:1px solid var(--border);padding:16px 18px;display:none}
    .rb-steps.open{display:block}
    .step-item{display:flex;gap:12px;margin-bottom:12px;align-items:flex-start}
    .step-item:last-child{margin-bottom:0}
    .step-num{width:22px;height:22px;border-radius:50%;background:rgba(255,255,255,0.08);border:1px solid rgba(255,255,255,0.22);display:flex;align-items:center;justify-content:center;font-size:10px;font-family:'JetBrains Mono',monospace;color:#ffffff;flex-shrink:0;margin-top:1px;font-weight:700;}
    .step-text{font-size:12px;color:var(--text2);line-height:1.6;font-family:'JetBrains Mono',monospace;font-weight:400}
    .step-cmd{background:rgba(255,255,255,0.04);border:1px solid rgba(255,255,255,0.07);border-radius:5px;padding:8px 12px;font-size:11px;font-family:'JetBrains Mono',monospace;color:#f1f5f9;margin-top:6px;overflow-x:auto;white-space:nowrap;font-weight:600;}
    @keyframes breathe{0%,100%{opacity:.7}50%{opacity:1}}
  </style>
</head>
<body>
<div class="app">
  <aside class="sidebar">
    <div class="sb-top"><a href="../index.html" class="sb-logo"><div class="sq">IQ</div><div><div class="brand">IncidentIQ</div><div class="brand-s">SRE War Room</div></div></a></div>
    <nav class="sb-nav">
      <a href="dashboard.html" class="sb-lnk"><span class="sb-icon">◈</span>War Room</a>
      <a href="incidents.html" class="sb-lnk"><span class="sb-icon">⬡</span>Incidents<span class="sb-badge">2</span></a>
      <a href="metrics.html"   class="sb-lnk"><span class="sb-icon">◎</span>Metrics</a>
      <a href="alerts.html"    class="sb-lnk"><span class="sb-icon">◇</span>Alerts</a>
      <a href="runbooks.html"  class="sb-lnk active"><span class="sb-icon">▷</span>Runbooks</a>
    </nav>
    <div class="sb-ai">
      <div class="sb-sec">AI Providers</div>
      <div class="sb-prov"><span class="dot"></span>Groq<span class="sb-lat">12ms</span></div>
      <div class="sb-prov"><span class="dot"></span>Gemini<span class="sb-lat">34ms</span></div>
      <div class="sb-prov"><span class="dot"></span>OpenAI<span class="sb-lat">28ms</span></div>
    </div>
    <div class="sb-ws"><span class="dot" style="animation:breathe 1.6s infinite"></span>WS Connected<div class="ws-bars"><div class="ws-b" style="height:5px"></div><div class="ws-b" style="height:8px"></div><div class="ws-b" style="height:11px"></div></div></div>
  </aside>

  <div class="main">
    <div class="topbar">
      <div class="ts"><div class="tl">TOTAL RUNBOOKS</div><div class="tv" style="color:var(--text)">18</div></div>
      <div class="ts"><div class="tl">LAST USED</div><div class="tv" style="color:var(--cyan)">2m ago</div></div>
      <div class="ts"><div class="tl">AUTO-LINKED</div><div class="tv" style="color:var(--green)">7</div></div>
      <div class="ts"><div class="tl">CATEGORIES</div><div class="tv" style="color:var(--purple)">5</div></div>
      <div class="topbar-time" id="clock">--:--:-- UTC</div>
    </div>

    <div class="content">
      <div class="page-hd">
        <div><div class="page-title">Runbooks</div><div class="page-sub">Standardised incident response procedures, AI-linked to active incidents</div></div>
        <button class="rb-btn primary" style="width:auto;padding:8px 18px;font-size:13px">+ New Runbook</button>
      </div>

      <div class="filter-pills">
        <button class="pill active" onclick="filterCat(this,'all')">All</button>
        <button class="pill" onclick="filterCat(this,'database')">Database</button>
        <button class="pill" onclick="filterCat(this,'memory')">Memory</button>
        <button class="pill" onclick="filterCat(this,'network')">Network</button>
        <button class="pill" onclick="filterCat(this,'service')">Service</button>
        <button class="pill" onclick="filterCat(this,'security')">Security</button>
        <input class="search-box" id="rb-search" placeholder="Search runbooks…" oninput="filterSearch(this.value)" />
      </div>

      <div class="rb-grid" id="rb-grid"></div>
    </div>
  </div>
</div>

<script>
const RUNBOOKS = [
  {
    id:'rb-001', cat:'database', catCol:'#F59E0B', catBg:'rgba(245,158,11,0.1)',
    title:'DB Connection Pool Exhaustion',
    desc:'Resolve PostgreSQL connection pool saturation. Covers drain, scale, and timeout config reset.',
    steps:4, lastUsed:'2 min ago', lastInc:'INC-2847', ai:true,
    steps_detail:[
      {text:'Check current pool utilization', cmd:"psql $DB_URL -c \"SELECT count(*) FROM pg_stat_activity WHERE state = 'idle';\""},
      {text:'Identify and terminate idle connections older than 5 minutes', cmd:"psql $DB_URL -c \"SELECT pg_terminate_backend(pid) FROM pg_stat_activity WHERE state = 'idle' AND state_change < NOW() - INTERVAL '5 min';\""},
      {text:'Scale pool limit via environment variable', cmd:'kubectl set env deployment/payments-api DB_POOL_MAX=200 -n production'},
      {text:'Monitor recovery — error rate should drop within 2 minutes', cmd:'watch -n2 "kubectl top pod -l app=payments-api -n production"'},
    ]
  },
  {
    id:'rb-002', cat:'memory', catCol:'#8B5CF6', catBg:'rgba(139,92,246,0.1)',
    title:'Memory Leak Investigation',
    desc:'Identify and mitigate unbounded heap growth on production pods before OOM kill.',
    steps:5, lastUsed:'3h ago', lastInc:'INC-2838', ai:false,
    steps_detail:[
      {text:'Identify top memory-consuming pods', cmd:'kubectl top pod --sort-by=memory -n production'},
      {text:'Capture heap dump for offline analysis', cmd:'kubectl exec -it &lt;pod-name&gt; -- node --heapsnapshot-signal=SIGUSR2 2>&1 &'},
      {text:'Annotate the pod to prevent scheduling', cmd:'kubectl annotate pod &lt;pod-name&gt; oom-candidate=true'},
      {text:'Rolling restart the affected deployment', cmd:'kubectl rollout restart deployment/&lt;name&gt; -n production'},
      {text:'Verify memory usage after restart', cmd:'kubectl top pod -l app=&lt;name&gt; -n production --sort-by=memory'},
    ]
  },
  {
    id:'rb-003', cat:'network', catCol:'#06B6D4', catBg:'rgba(6,182,212,0.1)',
    title:'API Cascade Failure Recovery',
    desc:'Recover from gateway timeout cascades affecting multiple downstream services.',
    steps:4, lastUsed:'2h ago', lastInc:'INC-2843', ai:false,
    steps_detail:[
      {text:'Identify which upstream service is the source of 503s', cmd:'kubectl logs -l app=gateway-api --tail=100 | grep "upstream connect error"'},
      {text:'Open circuit breaker manually if auto-trip failed', cmd:'kubectl set env deployment/gateway-api CIRCUIT_BREAKER_FORCED=open'},
      {text:'Restart the degraded upstream service', cmd:'kubectl rollout restart deployment/&lt;upstream-svc&gt; -n production'},
      {text:'Close circuit breaker and monitor error rate', cmd:'kubectl set env deployment/gateway-api CIRCUIT_BREAKER_FORCED='},
    ]
  },
  {
    id:'rb-004', cat:'database', catCol:'#F59E0B', catBg:'rgba(245,158,11,0.1)',
    title:'Postgres Replication Lag',
    desc:'Diagnose and resolve replication lag exceeding the 45-second SLO threshold.',
    steps:3, lastUsed:'16h ago', lastInc:'INC-2835', ai:false,
    steps_detail:[
      {text:'Check current replication lag on all replicas', cmd:'psql $DB_URL -c "SELECT client_addr, sent_lsn, write_lag, flush_lag, replay_lag FROM pg_stat_replication;"'},
      {text:'Check for long-running blocking transactions on primary', cmd:"psql $DB_URL -c \"SELECT pid, now()-query_start as duration, query FROM pg_stat_activity WHERE state='active' ORDER BY duration DESC LIMIT 5;\""},
      {text:'Terminate long-running blocker (if safe)', cmd:'psql $DB_URL -c "SELECT pg_terminate_backend(&lt;blocking_pid&gt;);"'},
    ]
  },
  {
    id:'rb-005', cat:'service', catCol:'#10B981', catBg:'rgba(16,185,129,0.1)',
    title:'Zero-Downtime Rolling Restart',
    desc:'Safely restart a degraded deployment with health checks and rollback capability.',
    steps:4, lastUsed:'4h ago', lastInc:'INC-2841', ai:false,
    steps_detail:[
      {text:'Confirm current replica count and health', cmd:'kubectl get deployment &lt;name&gt; -n production -o wide'},
      {text:'Initiate rolling restart', cmd:'kubectl rollout restart deployment/&lt;name&gt; -n production'},
      {text:'Watch rollout progress — abort if error rate climbs', cmd:'kubectl rollout status deployment/&lt;name&gt; -n production --timeout=120s'},
      {text:'Rollback if health degrades', cmd:'kubectl rollout undo deployment/&lt;name&gt; -n production'},
    ]
  },
  {
    id:'rb-006', cat:'security', catCol:'#EF4444', catBg:'rgba(239,68,68,0.1)',
    title:'JWT Certificate Rotation',
    desc:'Emergency rotation of expired or compromised JWT signing certificates with zero downtime.',
    steps:5, lastUsed:'1d ago', lastInc:'INC-2840', ai:false,
    steps_detail:[
      {text:'Generate new RSA keypair for JWT signing', cmd:'openssl genrsa -out jwt_private.pem 4096 && openssl rsa -in jwt_private.pem -pubout -out jwt_public.pem'},
      {text:'Store new key in secrets manager', cmd:'kubectl create secret generic jwt-signing-key --from-file=private=jwt_private.pem --from-file=public=jwt_public.pem -n production --dry-run=client -o yaml | kubectl apply -f -'},
      {text:'Trigger rolling restart to pick up new secret', cmd:'kubectl rollout restart deployment/auth-service -n production'},
      {text:'Force JWKS cache refresh on all consumers', cmd:'kubectl exec -it $(kubectl get pod -l app=auth-service -o name | head -1) -- curl -X POST localhost:3000/internal/jwks/refresh'},
      {text:'Validate token issuance with test client', cmd:'curl -X POST https://api.company.com/auth/token -d "grant_type=client_credentials" -H "Authorization: Basic &lt;test-creds&gt;"'},
    ]
  },
];

let activeCard = null;

function renderRunbooks(data){
  const grid=document.getElementById('rb-grid');
  grid.innerHTML=data.map(rb=>`
    <div class="rb-card" id="${rb.id}">
      <div class="rb-head">
        <div class="rb-cat" style="background:${rb.catBg};color:${rb.catCol};border:1px solid ${rb.catCol}30">${rb.cat.toUpperCase()}</div>
        ${rb.ai?`<span style="float:right;font-size:9px;background:rgba(59,130,246,0.1);color:#60A5FA;border:1px solid rgba(59,130,246,0.2);border-radius:3px;padding:2px 7px;font-family:'JetBrains Mono',monospace">AI LINKED</span>`:''}
        <div class="rb-title">${rb.title}</div>
        <div class="rb-desc">${rb.desc}</div>
      </div>
      <div class="rb-meta">
        <span class="rb-metaitem">▷ ${rb.steps} steps</span>
        <span class="rb-metaitem">⏱ Last used: ${rb.lastUsed}</span>
        <span class="rb-metaitem" style="color:${rb.ai?'#60A5FA':'var(--muted)'}">⬡ ${rb.lastInc}</span>
      </div>
      <div class="rb-actions">
        <button class="rb-btn" onclick="toggleSteps('${rb.id}')">View Steps</button>
        <button class="rb-btn primary" onclick="window.location.href='dashboard.html'">Run Now →</button>
      </div>
      <div class="rb-steps" id="steps-${rb.id}">
        ${rb.steps_detail.map((s,i)=>`
          <div class="step-item">
            <div class="step-num">${i+1}</div>
            <div>
              <div class="step-text">${s.text}</div>
              <div class="step-cmd">${s.cmd}</div>
            </div>
          </div>
        `).join('')}
      </div>
    </div>
  `).join('');
}

function toggleSteps(id){
  const el=document.getElementById('steps-'+id);
  const btn=document.querySelector(`#${id} .rb-btn`);
  const isOpen=el.classList.contains('open');
  document.querySelectorAll('.rb-steps').forEach(e=>e.classList.remove('open'));
  document.querySelectorAll('.rb-btn').forEach(b=>{ if(b.textContent.startsWith('Hide')) b.textContent='View Steps'; });
  if(!isOpen){ el.classList.add('open'); btn.textContent='Hide Steps'; }
}

let currentCat='all', currentSearch='';
function filterCat(el,cat){
  document.querySelectorAll('.pill').forEach(p=>p.classList.remove('active'));
  el.classList.add('active'); currentCat=cat; applyFilters();
}
function filterSearch(q){ currentSearch=q.toLowerCase(); applyFilters(); }
function applyFilters(){
  let data=RUNBOOKS;
  if(currentCat!=='all') data=data.filter(r=>r.cat===currentCat);
  if(currentSearch) data=data.filter(r=>r.title.toLowerCase().includes(currentSearch)||r.desc.toLowerCase().includes(currentSearch));
  renderRunbooks(data);
}

renderRunbooks(RUNBOOKS);
setInterval(()=>document.getElementById('clock').textContent=new Date().toLocaleTimeString('en-US',{hour12:false})+' UTC',1000);
</script>
</body>
</html>
